name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Required to push container images to ghcr.io.
  packages: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -race -cover

      # Required by the `sboms` section of .goreleaser.yml.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # dockers_v2 builds multi-platform images with buildx. QEMU provides the
      # arm64 emulation the runner lacks; buildx provides a builder capable of
      # producing a multi-platform manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Homebrew cask writes to adedayo/homebrew-tap, which
          # the default GITHUB_TOKEN cannot reach: it is scoped to this
          # repository only. Needs contents:write on the tap repository.
          #
          # Falls back to PAT_TOKEN, matching checkmate's releaser.yaml, so
          # whichever of the two secrets already exists is used.
          #
          # When neither is set this is empty, and .goreleaser.yml skips the
          # cask rather than failing the release.
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN || secrets.PAT_TOKEN }}
          # Publishing to winget means opening a pull request against
          # microsoft/winget-pkgs from a fork under this account. That needs a
          # PAT with contents:write and pull-requests:write on the fork; the
          # default GITHUB_TOKEN can do neither.
          #
          # HOMEBREW_GITHUB_TOKEN is the last fallback because the fine-grained
          # token behind it covers both adedayo/homebrew-tap and
          # adedayo/winget-pkgs. One token, one expiry to track. Setting
          # WINGET_GITHUB_TOKEN separately later takes precedence and splits
          # the two publishing paths without touching this file.
          #
          # When none are set this is empty, and .goreleaser.yml skips the
          # winget pipe rather than failing the release.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN || secrets.PAT_TOKEN || secrets.HOMEBREW_GITHUB_TOKEN }}
